spring.application.name=ForoHub
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/forohub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT secret: 64+ base64 chars. DO NOT expose in production.
# This default is for dev only.
security.jwt.secret=VGhpc0lzQVN1cGVyU2VjcmV0S2V5VGhhdElzQmFzZTY0RW5jb2RlZEFuZFNob3VsZEJlQ2hhbmdlZA==
security.jwt.expiration-ms=604800000

# H2 Console (dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
